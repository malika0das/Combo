name: combo_universal
description: Universal Combo, Display, Battery and Spare Parts compatibility list for mobile repair technicians.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  google_mobile_ads: ^9.1.0
  share_plus: ^10.0.2
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/catalog.json
    # Bundled brand fonts (Sora / Inter / JetBrains Mono). Populate with
    # `bash tools/fetch_fonts.sh` so nothing is fetched at runtime.
    - assets/google_fonts/
